[package]
name = "ddir"
version = "0.3.0"
edition = "2021"
description = "Desktop Director - lease-based window/software orchestration for AI agents"
license = "MIT"

[[bin]]
name = "ddir"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
