[package]
name = "ddir"
# Windows 线：0.8.0（main）。macOS 线单独编号：mac/Sources/Util.swift VERSION = 0.11.3
version = "0.8.3"
edition = "2021"
description = "Desktop Director - lease-based window/software orchestration for AI agents"
license = "MIT"

[[bin]]
name = "ddir"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
